<title>Intake Flight Report</title>
<style>
  /* Layout: header with run stats, then a stacked list of message "flight
     cards" - a horizontal node track per message, click a node to expand
     its under-the-hood detail panel below the track. */
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --border: #e4e1d9;
    --ink: #1e1c18;
    --ink-dim: #6b675e;
    --accent: #b45309;
    --pass: #2f7d4f;
    --warn: #b7791f;
    --fail: #b3261e;
    --pending: #c9c5ba;
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17140f;
      --surface: #211d17;
      --border: #38332a;
      --ink: #f1ede4;
      --ink-dim: #a89f8f;
      --accent: #e0912f;
      --pass: #5cb87f;
      --warn: #e0ab4c;
      --fail: #e6675f;
      --pending: #4a4438;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17140f; --surface: #211d17; --border: #38332a; --ink: #f1ede4;
    --ink-dim: #a89f8f; --accent: #e0912f; --pass: #5cb87f; --warn: #e0ab4c;
    --fail: #e6675f; --pending: #4a4438; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    margin: 0;
    padding-inline: 20px;
    padding-block: 28px;
  }
  a { color: var(--accent); }

  .wrap { max-width: 820px; margin: 0 auto; }

  header h1 {
    font-family: var(--font-display);
    font-size: clamp(1.6rem, 4vw, 2.1rem);
    font-weight: 600;
    margin: 0 0 4px;
    text-wrap: balance;
  }
  header p.sub {
    color: var(--ink-dim);
    margin: 0 0 18px;
    font-size: 0.95rem;
  }
  .stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    min-width: 90px;
    flex: 1 1 90px;
  }
  .stat .n {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 1.4rem;
    font-weight: 600;
    display: block;
  }
  .stat .l {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-dim);
  }
  .stat.pass .n { color: var(--pass); }
  .stat.warn .n { color: var(--warn); }
  .stat.fail .n { color: var(--fail); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 18px 14px;
    margin-bottom: 16px;
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }
  .card-head .subject {
    font-weight: 600;
    font-size: 1.02rem;
  }
  .card-head .from {
    color: var(--ink-dim);
    font-size: 0.85rem;
    font-family: var(--font-mono);
  }
  .card-meta {
    color: var(--ink-dim);
    font-size: 0.82rem;
    margin-bottom: 14px;
  }
  .card-meta b { color: var(--ink); font-weight: 600; }

  .track {
    display: flex;
    align-items: center;
    overflow-x: auto;
    padding-block: 4px 2px;
    gap: 0;
  }
  .node {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    padding: 4px 2px;
    min-width: 74px;
    border: none;
    background: none;
    font-family: inherit;
  }
  .dot {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    border: 2px solid var(--pending);
    color: var(--ink-dim);
    transition: transform 0.15s ease;
  }
  .node:hover .dot { transform: scale(1.08); }
  .node.pass .dot { border-color: var(--pass); color: var(--pass); background: color-mix(in srgb, var(--pass) 12%, transparent); }
  .node.warn .dot { border-color: var(--warn); color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .node.fail .dot { border-color: var(--fail); color: var(--fail); background: color-mix(in srgb, var(--fail) 14%, transparent); }
  .node .label {
    font-size: 0.68rem;
    color: var(--ink-dim);
    text-align: center;
    line-height: 1.15;
  }
  .node.selected .label { color: var(--ink); font-weight: 600; }
  .connector {
    flex: 1 1 24px;
    min-width: 16px;
    height: 2px;
    background: var(--border);
    margin-top: -18px;
  }

  .detail {
    margin-top: 10px;
    background: color-mix(in srgb, var(--accent) 6%, var(--surface));
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.86rem;
    display: none;
  }
  .detail.open { display: block; }
  .detail .stage-name {
    font-weight: 600;
    margin-bottom: 4px;
  }
  .detail .stage-detail {
    color: var(--ink-dim);
    font-family: var(--font-mono);
    font-size: 0.8rem;
    word-break: break-word;
  }

  .outcome {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 0.87rem;
    border: 1px solid var(--border);
  }
  .outcome.pass { border-color: var(--pass); background: color-mix(in srgb, var(--pass) 10%, transparent); }
  .outcome.warn { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); }
  .outcome.fail { border-color: var(--fail); background: color-mix(in srgb, var(--fail) 10%, transparent); }
  .outcome b { display: block; margin-bottom: 2px; }

  footer {
    margin-top: 24px;
    color: var(--ink-dim);
    font-size: 0.78rem;
    text-align: center;
  }
  footer code { font-family: var(--font-mono); }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

<div class="wrap">
  <header>
    <h1>Intake Flight Report</h1>
    <p class="sub">Jede Nachricht flog wirklich durch Dataverse - echte Idempotenz-Pruefung, echte Dublettenpruefung, echte hsv_processingattempt-Zeilen. Klicke auf einen Knoten fuer Details.</p>
    <div class="stats" id="stats"></div>
  </header>
  <main id="cards"></main>
  <footer>Generiert aus <code id="tracefile">trace.json</code> - Service Intake V2</footer>
</div>

<script>
const TRACE = __TRACE_JSON__;
const TRACE_FILE = "__TRACE_FILE__";

const STAGE_ICONS = { 'Ingest': '✉', 'Parse': '⚙', 'Validate': '✓', 'Duplicate Check': '⊕', 'Decision': '⚑' };

function outcomeClass(status) {
  if (status === 'Converted') return 'pass';
  if (status === 'Duplicate') return 'fail';
  return 'warn';
}
function nodeClass(result) {
  if (result === 'Pass' || result === 'Converted') return 'pass';
  if (result === 'Duplicate' || result === 'Fail') return 'fail';
  if (!result) return '';
  return 'warn';
}

function render() {
  document.getElementById('tracefile').textContent = TRACE_FILE;

  const counts = { pass: 0, warn: 0, fail: 0 };
  TRACE.forEach(t => counts[outcomeClass(t.finalStatus)]++);
  const statsEl = document.getElementById('stats');
  statsEl.innerHTML = `
    <div class="stat"><span class="n">${TRACE.length}</span><span class="l">Nachrichten</span></div>
    <div class="stat pass"><span class="n">${counts.pass}</span><span class="l">Converted</span></div>
    <div class="stat warn"><span class="n">${counts.warn}</span><span class="l">Klaerung / Dublette</span></div>
    <div class="stat fail"><span class="n">${counts.fail}</span><span class="l">Technisches Duplikat</span></div>
  `;

  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = '';

  TRACE.forEach((t, ti) => {
    const card = document.createElement('div');
    card.className = 'card';

    const head = document.createElement('div');
    head.className = 'card-head';
    head.innerHTML = `<span class="subject">${escapeHtml(t.input.Subject)}</span><span class="from">${escapeHtml(t.input.FromAddress)}</span>`;
    card.appendChild(head);

    const meta = document.createElement('div');
    meta.className = 'card-meta';
    meta.innerHTML = `Kunde <b>${escapeHtml(t.input.CustomerName || '-')}</b> - Objekt <b>${escapeHtml(t.input.ObjectNumber || 'fehlt')}</b> - Provider-ID <code>${escapeHtml(t.input.ProviderMessageId)}</code>`;
    card.appendChild(meta);

    const track = document.createElement('div');
    track.className = 'track';

    const detail = document.createElement('div');
    detail.className = 'detail';

    t.stages.forEach((s, si) => {
      if (si > 0) {
        const c = document.createElement('div');
        c.className = 'connector';
        track.appendChild(c);
      }
      const node = document.createElement('button');
      node.className = 'node ' + nodeClass(s.result);
      node.innerHTML = `<span class="dot">${STAGE_ICONS[s.name] || '•'}</span><span class="label">${s.name}</span>`;
      node.addEventListener('click', () => {
        const wasOpenOnThis = detail.dataset.openIndex == si && detail.classList.contains('open');
        track.querySelectorAll('.node').forEach(n => n.classList.remove('selected'));
        if (wasOpenOnThis) {
          detail.classList.remove('open');
        } else {
          node.classList.add('selected');
          detail.dataset.openIndex = si;
          detail.innerHTML = `<div class="stage-name">${s.name} - ${s.result}</div><div class="stage-detail">${escapeHtml(s.detail)}</div>`;
          detail.classList.add('open');
        }
      });
      track.appendChild(node);
    });

    card.appendChild(track);
    card.appendChild(detail);

    const outcome = document.createElement('div');
    outcome.className = 'outcome ' + outcomeClass(t.finalStatus);
    outcome.innerHTML = `<b>${escapeHtml(t.finalStatus)}</b>${escapeHtml(t.finalDetail || '')}`;
    card.appendChild(outcome);

    cardsEl.appendChild(card);
  });
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

render();
</script>
