# Configuration rows for hsv_statustransition.
# Source: docs/01-prozessbeschreibung.md §5.1 (message state machine, full
# table) and §5.2/§5.3 (work order state machine, much less detailed in the
# source doc). This is data, not schema - seeded by
# scripts/seed-statustransitions.ps1, not deploy.ps1.
#
# Rows with a combined "Von"/"Nach" cell in the source table (e.g.
# "Received / Parsed" -> Technical Retry) are split into separate atomic
# rows here, since hsv_fromstatus/hsv_tostatus are single text values.
#
# hsv_allowedtrigger uses the PLACEHOLDER local option set from
# schema/tables.yaml (System/Disponent/Techniker/Plattformbetreuer) - see the
# flag at the top of that file. Trigger assignment below is my own
# best-effort mapping from context (who/what causes each transition per
# docs/01-prozessbeschreibung.md's process description), not something the
# source docs state explicitly per row.
#
# INFERRED, NOT IN SOURCE DOCS: the work order "Storniert" transitions.
# docs/01-prozessbeschreibung.md §5.2 only says "Neu -> Zugewiesen -> In
# Arbeit -> Abgeschlossen, dazu Storniert" without saying which states can
# reach Storniert. Modeled here as reachable from Neu, Zugewiesen, and In
# Arbeit (i.e. any non-terminal state) - flagged, confirm before relying on
# this in a validator.
#
# Storniert -> Neu was added on request (2026-09-30): Storniert was
# otherwise a dead end (no fromStatus: Storniert row existed at all), so a
# cancelled work order could never be reopened. Only Storniert -> Neu is
# allowed back out, not directly to Zugewiesen/In Arbeit/Abgeschlossen - a
# reopened order re-enters the normal Disponent-assigns-first flow.
#
# fromStatus: "(none)" rows (added 2026-09, review item 15/16): these are
# not real state transitions - they encode the one status value each entity
# is allowed to have on Create. seed-statustransitions.ps1 maps "(none)" to
# the sentinel hsv_FromStatusValue = 0 (not a real Choice value in either
# option set). CanTransitionPlugin now validates Create the same way it
# validates Update - by treating "record doesn't exist yet" as fromStatus
# value 0 - so these rows ARE where that rule lives, per review item 12's
# instruction to make hsv_statustransition the actual source of rules
# rather than hardcoding it in the plugin.

messageTransitions:
  - fromStatus: "(none)"
    toStatus: Received
    trigger: System
    reason: Initial status required on Create (docs/01-prozessbeschreibung.md §5.1 - every message starts Received).
  - fromStatus: Received
    toStatus: Parsed
    trigger: System
    reason: Parser erfolgreich
  - fromStatus: Received
    toStatus: Duplicate
    trigger: System
    reason: Message-ID bereits verarbeitet
  - fromStatus: Received
    toStatus: Technical Retry
    trigger: System
    reason: "temporärer Fehler (429, Timeout, 5xx)"
  - fromStatus: Parsed
    toStatus: Technical Retry
    trigger: System
    reason: "temporärer Fehler (429, Timeout, 5xx)"
  - fromStatus: Technical Retry
    toStatus: Parsed
    trigger: System
    reason: Wiederholung erfolgreich
  - fromStatus: Technical Retry
    toStatus: Validated
    trigger: System
    reason: Wiederholung erfolgreich
  - fromStatus: Technical Retry
    toStatus: Failed
    trigger: System
    reason: Retry-Budget erschöpft
  - fromStatus: Parsed
    toStatus: Validated
    trigger: System
    reason: alle Pflichtfelder und Regeln erfüllt
  - fromStatus: Parsed
    toStatus: Needs Clarification
    trigger: System
    reason: Pflichtfeld fehlt oder Regel verletzt
  - fromStatus: Parsed
    toStatus: Not Relevant
    trigger: System
    reason: keine Auftragsanfrage
  - fromStatus: Needs Clarification
    toStatus: Parsed
    trigger: System
    reason: Angaben ergänzt, erneute Verarbeitung
  - fromStatus: Validated
    toStatus: Potential Duplicate
    trigger: System
    reason: fachlicher Treffer im Zeitfenster
  - fromStatus: Potential Duplicate
    toStatus: Converted
    trigger: Disponent
    reason: Entscheidung des Disponenten, mit Begründung
  - fromStatus: Potential Duplicate
    toStatus: Duplicate
    trigger: Disponent
    reason: Entscheidung des Disponenten, mit Begründung
  - fromStatus: Validated
    toStatus: Converted
    trigger: System
    reason: Auftrag angelegt
  - fromStatus: Validated
    toStatus: Linked
    trigger: System
    reason: Nachricht gehört zu bestehendem Auftrag
  - fromStatus: Failed
    toStatus: Technical Retry
    trigger: Plattformbetreuer
    reason: manueller Replay durch Plattformbetreuer

workOrderTransitions:
  - fromStatus: "(none)"
    toStatus: Neu
    trigger: System
    reason: Initial status required on Create (docs/01-prozessbeschreibung.md §5.2 - every work order starts Neu).
  - fromStatus: Neu
    toStatus: Zugewiesen
    trigger: Disponent
    reason: Disponent weist Techniker zu
  - fromStatus: Zugewiesen
    toStatus: In Arbeit
    trigger: Techniker
    reason: Techniker nimmt Auftrag an
  - fromStatus: In Arbeit
    toStatus: Abgeschlossen
    trigger: Techniker
    reason: Techniker dokumentiert Abschluss
  - fromStatus: Neu
    toStatus: Storniert
    trigger: Disponent
    reason: "Auftrag storniert (INFERRED - nicht explizit in docs, siehe Hinweis oben)"
  - fromStatus: Zugewiesen
    toStatus: Storniert
    trigger: Disponent
    reason: "Auftrag storniert (INFERRED)"
  - fromStatus: In Arbeit
    toStatus: Storniert
    trigger: Disponent
    reason: "Auftrag storniert (INFERRED)"
  - fromStatus: Storniert
    toStatus: Neu
    trigger: Disponent
    reason: "Stornierung rueckgaengig gemacht - Auftrag wird erneut aufgenommen (added 2026-09-30, on request)"
